[package]
name = "nodex-notes"
version = "0.43.2"
edition = "2024"
description = "Notas rápidas estilo Notepad con espacios de trabajo, reuniones e IA que organiza sola"
license = "MIT"
repository = "https://github.com/jpreyes/nodex-notes"

# El servidor de la IA incluida vive en server/ (se compila aparte: cargo build -p nodex-ia).
[workspace]
members = [".", "server"]
default-members = ["."]

[dependencies]
# Pegar capturas de pantalla (imagen del portapapeles) y guardarlas como PNG.
arboard = "3.6"
base64 = "0.22"
# La configuración que viaja con la cuenta va cifrada.
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.14.0"
genai = "0.6.5"
getrandom = "0.3"
# Fotos y otras imágenes adjuntas (JPG, GIF, WebP…), además de las capturas PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
imap = { version = "3.0.0-alpha.15", default-features = false }
mail-parser = "0.11"
notify = "8"
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
rfd = "0.17.2"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt"] }
toml = "1.1.6"
webpki-roots = "1"

[dev-dependencies]
# Solo para el banco de pruebas de rendimiento (RAM del proceso).
memory-stats = "1"
# Prueba de punta a punta de la IA incluida (la app, el servidor y una IA falsa).
nodex-ia = { path = "server" }
axum = "0.8"

# Saber si se presionó Ctrl+V cuando el portapapeles solo tiene una imagen (egui no lo avisa).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
# En segundo plano: el ícono junto al reloj.
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"

# Lo mismo en Linux (X11).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Paquete .deb para Debian/Ubuntu (cargo deb). Las librerías gráficas se cargan en tiempo
# de ejecución, por eso se declaran a mano además de $auto.
[package.metadata.deb]
name = "nodex-notes"
maintainer = "JP Reyes <jpreyes@users.noreply.github.com>"
copyright = "2026, JP Reyes"
license-file = ["LICENSE", "0"]
extended-description = "Notas rápidas estilo Notepad con espacios de trabajo, reuniones e IA que organiza sola. Guarda todo en archivos Markdown."
section = "editors"
priority = "optional"
depends = "$auto, libxkbcommon0, libgl1, libegl1"
assets = [
    ["target/release/nodex-notes", "usr/bin/", "755"],
    ["packaging/linux/nodex-notes.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/nodex-notes.png", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/nodex-notes.png", "644"],
    ["README.md", "usr/share/doc/nodex-notes/README.md", "644"],
]
