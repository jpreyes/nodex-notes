[package]
name = "nodex-notes"
version = "0.2.0"
edition = "2024"
description = "Notas rápidas estilo Notepad con espacios de trabajo, reuniones e IA que organiza sola"
license = "MIT"
repository = "https://github.com/jpreyes/nodex-notes"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.14.0"
genai = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt"] }
toml = "1.1.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
