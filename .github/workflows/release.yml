# Al subir una etiqueta vX.Y.Z: crea el Release como borrador, le adjunta los ejecutables
# de cada sistema y recién entonces lo publica (así "latest" nunca queda sin archivos).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Crear release (borrador)
        run: |
          gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" --title "Notas $TAG" --notes "Descargas para Windows, macOS y Linux. Instrucciones en el README."

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: Notas-windows-x64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: Notas-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: Notas-macos-apple-silicon.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: Notas-macos-intel.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Empaquetar
        run: |
          BIN=target/${{ matrix.target }}/release/nodex-notes
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              cp "$BIN.exe" "dist/${{ matrix.asset }}" ;;
            Linux)
              tar -czf "dist/${{ matrix.asset }}" -C "$(dirname "$BIN")" nodex-notes ;;
            macOS)
              APP=dist/Notas.app
              mkdir -p "$APP/Contents/MacOS"
              cp "$BIN" "$APP/Contents/MacOS/nodex-notes"
              cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Notas</string>
            <key>CFBundleDisplayName</key><string>Notas</string>
            <key>CFBundleIdentifier</key><string>io.github.jpreyes.nodex-notes</string>
            <key>CFBundleExecutable</key><string>nodex-notes</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${TAG#v}</string>
            <key>CFBundleVersion</key><string>${TAG#v}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF
              codesign --force --deep --sign - "$APP"
              (cd dist && ditto -c -k --keepParent Notas.app "${{ matrix.asset }}") ;;
          esac

      - name: Subir al release
        run: gh release upload "$TAG" "dist/${{ matrix.asset }}" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
