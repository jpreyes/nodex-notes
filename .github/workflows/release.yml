# Al subir una etiqueta vX.Y.Z: crea el Release como borrador, le adjunta los ejecutables e
# instaladores de cada sistema y recién entonces lo publica (así "latest" nunca queda sin archivos).
# Lanzado a mano (workflow_dispatch) solo compila y empaqueta, sin publicar nada: sirve de prueba.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  create:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Crear release (borrador)
        run: |
          gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" --title "Notas $TAG" --notes "Descargas para Windows, macOS y Linux. Instrucciones en el README."

  build:
    needs: create
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            mac: apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            mac: intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Empaquetar
        run: |
          BIN=target/${{ matrix.target }}/release/nodex-notes
          VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist pkg
          case "${{ runner.os }}" in
            Windows)
              cp "$BIN.exe" dist/Notas-windows-x64.exe
              # Instalador .msi (WiX Toolset v3; si el runner no lo trae, se instala).
              WIXBIN=$(ls -d "/c/Program Files (x86)/WiX Toolset v3"*/bin 2>/dev/null | head -1)
              if [ -z "$WIXBIN" ]; then
                choco install wixtoolset --no-progress -y
                WIXBIN=$(ls -d "/c/Program Files (x86)/WiX Toolset v3"*/bin | head -1)
              fi
              "$WIXBIN/candle.exe" -nologo -arch x64 -dVersion="$VER" -dExePath="$BIN.exe" \
                -dLicenseRtf=wix/License.rtf -dIconPath=assets/icon.ico wix/main.wxs -out pkg/main.wixobj
              "$WIXBIN/light.exe" -nologo -spdb -ext WixUIExtension -cultures:es-es \
                pkg/main.wixobj -out dist/Notas-windows-x64.msi ;;
            Linux)
              tar -czf dist/Notas-linux-x64.tar.gz -C "$(dirname "$BIN")" nodex-notes
              # Paquete .deb
              cargo install cargo-deb --locked
              cargo deb --no-build --target ${{ matrix.target }} --output dist/Notas-linux-x64.deb
              dpkg-deb --info dist/Notas-linux-x64.deb && dpkg-deb --contents dist/Notas-linux-x64.deb ;;
            macOS)
              APP=pkg/Notas.app
              mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
              cp "$BIN" "$APP/Contents/MacOS/nodex-notes"
              # Ícono .icns a partir del PNG de 1024 px
              ICONSET=pkg/AppIcon.iconset; mkdir -p "$ICONSET"
              for s in 16 32 128 256 512; do
                sips -z $s $s assets/icon-1024.png --out "$ICONSET/icon_${s}x${s}.png" > /dev/null
                sips -z $((s*2)) $((s*2)) assets/icon-1024.png --out "$ICONSET/icon_${s}x${s}@2x.png" > /dev/null
              done
              iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
              cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Notas</string>
            <key>CFBundleDisplayName</key><string>Notas</string>
            <key>CFBundleIdentifier</key><string>io.github.jpreyes.nodex-notes</string>
            <key>CFBundleExecutable</key><string>nodex-notes</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VER</string>
            <key>CFBundleVersion</key><string>$VER</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF
              codesign --force --deep --sign - "$APP"
              (cd pkg && ditto -c -k --keepParent Notas.app "../dist/Notas-macos-${{ matrix.mac }}.zip") ;;
          esac
          ls -la dist

      - name: Subir al release
        if: env.PUBLISH == 'true'
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
